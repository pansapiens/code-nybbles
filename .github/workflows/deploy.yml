name: CI and deploy

on:
  push:
    branches: [main]
    tags: ['v*'] # v0.1, v0.1.0
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: app
        run: pnpm exec eslint . && pnpm lint:style
      - name: Type-check
        run: pnpm type-check
      # rustup reads tools/rust-verify/rust-toolchain.toml and installs the pinned toolchain
      - name: Rust toolchain
        working-directory: tools/rust-verify
        run: rustc --version
      - uses: actions/cache@v6
        with:
          path: tools/rust-verify/.cache
          key: rust-verify-${{ hashFiles('tools/rust-verify/rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: rust-verify-${{ hashFiles('tools/rust-verify/rust-toolchain.toml') }}-
      - name: Unit tests
        run: pnpm test
      - name: Content build tests
        working-directory: tools/content-build
        run: node --test build.test.ts
      - name: Content build + rust-verify
        run: pnpm content:build --strict # warnings fail CI too
      - name: Build
        working-directory: app
        run: pnpm build-only
      - name: E2E tests
        working-directory: app
        run: pnpm exec playwright install --with-deps chromium && pnpm test:e2e
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: app/dist
      - name: Pack course content
        if: startsWith(github.ref, 'refs/tags/v')
        run: tar -C app/public -czf course-content.tar.gz content
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: course-content
          path: course-content.tar.gz
          retention-days: 1

  android:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: course-content
      - run: tar -C app/public -xzf course-content.tar.gz
      - name: Build the web bundle into the Android project
        working-directory: app
        run: pnpm build:android
      - name: Assemble debug APK
        working-directory: app/android
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)(\.([0-9]+))?$ ]]; then
            echo "Tag must look like v0.1 or v0.1.0"
            exit 1
          fi
          major=${BASH_REMATCH[1]}
          minor=${BASH_REMATCH[2]}
          patch=${BASH_REMATCH[4]:-0}
          code=$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))
          name="${tag#v}"
          echo "versionName=$name versionCode=$code"
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK not found}}"
          yes | sdkmanager --licenses >/dev/null || true
          ./gradlew assembleDebug --no-daemon -PappVersionName="$name" -PappVersionCode="$code"
      - name: Publish the APK on the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          asset="code-nybbles-${tag}.apk"
          cp app/android/app/build/outputs/apk/debug/app-debug.apk "$asset"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" --title "$tag" --generate-notes
          fi

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
