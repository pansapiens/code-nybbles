id: structs-enums.methods.auto-ref
title: Automatic referencing
icon: layers
concepts: [method.auto-ref]
reviewConcepts: [method.self, method.associated, style.new, borrow.shared, borrow.mut, borrow.exclusive, err.E0499, err.E0382]
lessons:
  - id: l1
    exercises:
      - type: concept
        id: concept-auto-ref
        title: Rust borrows for you
        markdown: |
          **When you call a method, Rust adds the `&` or `&mut` it needs.** `area` takes `&self`, so `rect.area()` borrows `rect` for you.

          All three calls below do the same thing.
        code:
          rust: |
            struct Rect { w: u32, h: u32 }

            impl Rect {
                fn area(&self) -> u32 {
                    self.w * self.h
                }
            }

            fn main() {
                let rect = Rect { w: 3, h: 4 };
                println!("{}", rect.area());
                println!("{}", (&rect).area());
                println!("{}", Rect::area(&rect));
            }
          verify: run
          expectStdout: "12\n12\n12\n"
        concepts: [method.auto-ref]

      - type: true-false
        id: tf-same-call
        prompt: "If `area` takes `&self`, then `rect.area()` and `(&rect).area()` do the same thing."
        answer: true
        explanation: "Rust sees that `area` wants `&self` and borrows `rect` for you. Writing the `&` yourself gives the same call."
        concepts: [method.auto-ref]

      - type: mcq
        id: mcq-same-as-add
        prompt: "`add` takes `&mut self`. Which call is the same as `taps.add()`?"
        options:
          - { id: a, code: "(&mut taps).add();" }
          - { id: b, code: "(&taps).add();", why: "That's a shared borrow, and `add` needs `&mut self`. It fails: the value can't be borrowed as mutable through a shared reference." }
          - { id: c, code: "Counter::add(taps);", why: "Written this way, nothing is borrowed for you. `add` expects `&mut Counter`, so this is a *mismatched types* error." }
        answer: a
        explanation: "Rust matches the method's `self` parameter, so for `&mut self` it borrows `taps` mutably."
        concepts: [method.auto-ref]

      - type: predict-output
        id: predict-through-ref
        code:
          rust: |
            struct Rect { w: u32, h: u32 }

            impl Rect {
                fn area(&self) -> u32 {
                    self.w * self.h
                }
            }

            fn main() {
                let rect = Rect { w: 2, h: 5 };
                let view = &rect;
                println!("{}", view.area());
            }
          verify: run
        options:
          - { id: a, text: "10" }
          - { id: b, text: "7", why: "`area` multiplies `w` by `h`." }
          - { id: c, text: "0", why: "`view` refers to `rect`, so the method sees the same fields." }
        answer: a
        explanation: "`view` is already a `&Rect`, which is what `&self` needs, so `view.area()` works directly."
        concepts: [method.auto-ref, borrow.shared]

      - type: compiles
        id: compiles-ref-param
        code:
          rust: |
            struct Rect { w: u32, h: u32 }

            impl Rect {
                fn area(&self) -> u32 {
                    self.w * self.h
                }
            }

            fn show(r: &Rect) {
                println!("{}", r.area());
            }

            fn main() {
                show(&Rect { w: 6, h: 2 });
            }
          verify: run
          expectStdout: "12\n"
        answer: true
        explanation: "Inside `show`, `r` is a `&Rect`, which is exactly what `area`'s `&self` needs. The program prints 12."
        concepts: [method.auto-ref]

      - type: concept
        id: concept-many-impls
        title: More than one impl block
        markdown: |
          **A type can have several `impl` blocks.** Their functions all belong to the same type, as if they were in one block.

          One block is the usual choice, but you'll see more than one in bigger programs. Both methods below work on any `Rect`.
        code:
          rust: |
            struct Rect { w: u32, h: u32 }

            impl Rect {
                fn area(&self) -> u32 {
                    self.w * self.h
                }
            }

            impl Rect {
                fn is_wide(&self) -> bool {
                    self.w > self.h
                }
            }
          verify: run
          wrap: none
          hidden:
            after: |
              fn main() {
                  let r = Rect { w: 3, h: 2 };
                  println!("{} {}", r.area(), r.is_wide());
              }
          expectStdout: "6 true\n"
        concepts: [method.auto-ref]

      - type: predict-output
        id: predict-two-impls
        code:
          rust: |
            struct Tally { n: u32 }

            impl Tally {
                fn new() -> Self { Self { n: 1 } }
            }

            impl Tally {
                fn bump(&mut self) { self.n *= 3; }
            }

            fn main() {
                let mut t = Tally::new();
                t.bump();
                println!("{}", t.n);
            }
          verify: run
        options:
          - { id: a, text: "3" }
          - { id: b, text: "1", why: "`bump` is a method of `Tally` even though it's in the second block, and it changes `t`." }
          - { id: c, text: "4", why: "`*=` multiplies; it doesn't add." }
        answer: a
        explanation: "Both blocks add functions to `Tally`. `new` starts `n` at 1, and `bump` triples it."
        concepts: [method.auto-ref, style.new]

      - type: fill-tokens
        id: fill-explicit-call
        prompt: Fill the blank so the program prints `1`
        code:
          rust: |
            struct Counter { count: u32 }

            impl Counter {
                fn add(&mut self) {
                    self.count += 1;
                }
            }

            fn main() {
                let mut c = Counter { count: 0 };
                Counter::add(___1___ c);
                println!("{}", c.count);
            }
          verify: run
          expectStdout: "1\n"
        blanks:
          "1": { answer: ["&mut"] }
        bank: ["&mut", "&", "mut", "*"]
        explanation: "With the `Type::method` form, Rust doesn't borrow for you, so you pass `&mut c` to match `&mut self`."
        concepts: [method.auto-ref]

      - type: match-pairs
        id: pairs-same-call
        prompt: Match each method call to the same call written out in full
        pairs:
          - ["rect.area()", "Rect::area(&rect)"]
          - ["taps.add()", "Counter::add(&mut taps)"]
          - ["pass.into_owner()", "Ticket::into_owner(pass)"]
        explanation: "`area` takes `&self`, `add` takes `&mut self` and `into_owner` takes `self`. Rust matches each one."
        concepts: [method.auto-ref, method.self]

  - id: l2
    exercises:
      - type: concept
        id: concept-chaining
        title: Chaining calls
        markdown: |
          **A method's result can have methods too.** If `name` returns a `&str`, `p.name().len()` calls `len` on it.

          A method that returns `&mut Self` (its own `self`) lets you chain more calls on the same value.
        code:
          rust: |
            struct Timer { secs: u32 }

            impl Timer {
                fn tick(&mut self) -> &mut Self {
                    self.secs += 1;
                    self
                }
            }

            fn main() {
                let mut t = Timer { secs: 0 };
                t.tick().tick().tick();
                println!("{}", t.secs);
            }
          verify: run
          expectStdout: "3\n"
        concepts: [method.auto-ref]

      - type: predict-output
        id: predict-name-len
        code:
          rust: |
            struct Pet { name: String }

            impl Pet {
                fn name(&self) -> &str {
                    &self.name
                }
            }

            fn main() {
                let name = String::from("Tom");
                let cat = Pet { name };
                println!("{}", cat.name().len());
            }
          verify: run
        options:
          - { id: a, text: "3" }
          - { id: b, text: "Tom", why: "`.len()` is called on the name, so it prints its length in bytes." }
          - { id: c, text: "1", why: "There's one `Pet`, but `len` measures the name `Tom`." }
        answer: a
        explanation: "`cat.name()` returns `\"Tom\"` as a `&str`, and `.len()` on that is 3."
        concepts: [method.auto-ref, slice.str]

      - type: predict-output
        id: predict-chain-add
        code:
          rust: |
            struct Score { total: u32 }

            impl Score {
                fn twice(&mut self) -> &mut Self {
                    self.total *= 2;
                    self
                }
            }

            fn main() {
                let mut s = Score { total: 3 };
                s.twice().twice().twice();
                println!("{}", s.total);
            }
          verify: run
        options:
          - { id: a, text: "24" }
          - { id: b, text: "6", why: "Each `twice` returns `&mut Self`, so the later calls change `s` too." }
          - { id: c, text: "12", why: "There are three calls: 3, 6, 12, then 24." }
        answer: a
        explanation: "Each `twice` doubles `s` and returns a mutable borrow of it, so the next call works on the same value: 3, 6, 12, 24."
        concepts: [method.auto-ref]

      - type: compiles
        id: compiles-shared-ref-mut-method
        code:
          rust: |
            struct Counter { count: u32 }

            impl Counter {
                fn add(&mut self) {
                    self.count += 1;
                }
            }

            fn main() {
                let mut c = Counter { count: 0 };
                let r = &c;
                r.add();
            }
          verify: compile-fail
          expectErrors: [E0596]
        answer: false
        followUp:
          prompt: Which error?
          options:
            - { id: a, text: "cannot borrow `*r` as mutable, as it is behind a `&` reference" }
            - { id: b, text: "no method named `add` found for reference `&Counter`", why: "Rust finds `add` through the reference. The problem is the kind of borrow." }
            - { id: c, text: "cannot borrow `c` as mutable because it is also borrowed as immutable", why: "The method is called on `r`, not `c`, so the error is about `r`." }
          answer: a
        explanation: "Rust can borrow for you, but it can't turn a shared `&` reference into `&mut`. `r` would need to be `&mut c`."
        concepts: [method.auto-ref, borrow.mut, err.E0596]

      - type: decode-error
        id: decode-param-ref
        prompt: What's the best fix?
        code:
          rust: |
            struct Counter { n: u32 }

            impl Counter {
                fn add(&mut self) { self.n += 1; }
            }

            fn bump(c: &Counter) {
                c.add();
            }

            fn main() {
                let mut taps = Counter { n: 0 };
                bump(&taps);
            }
          verify: compile-fail
          expectErrors: [E0596]
        options:
          - { id: a, text: "Make `bump` take `c: &mut Counter` and call `bump(&mut taps)`" }
          - { id: b, text: "Change line 8 to `(&mut c).add();`", why: "`c` is a shared reference, so you can't get a `&mut` from it (and `c` isn't `mut` either)." }
          - { id: c, text: "Change line 4 to `fn add(&self) { self.n += 1; }`", why: "Then `add` can't change `self.n`, so it fails." }
        answer: a
        explanation: "`add` needs a mutable borrow, and a `&Counter` can't give one. The parameter and the call both need `&mut`."
        concepts: [method.auto-ref, own.param-choice, err.E0596]

      - type: true-false
        id: tf-no-mut-needed
        prompt: "Because Rust borrows for you, you don't need `let mut` to call a `&mut self` method."
        answer: false
        explanation: "Rust adds the `&mut`, but a mutable borrow still needs a `mut` variable. Without it the compiler says *cannot borrow as mutable*."
        concepts: [method.auto-ref, method.self]

      - type: spot-bug
        id: spot-chain-not-mut
        prompt: Tap the line with the mistake
        code:
          rust: |
            struct Score { total: u32 }

            impl Score {
                fn add(&mut self) -> &mut Self {
                    self.total += 1;
                    self
                }
            }

            fn main() {
                let s = Score { total: 0 };
                s.add().add();
                println!("{}", s.total);
            }
          verify: compile-fail
          expectErrors: [E0596]
        answer: 11
        explanation: "The error is reported on line 12, but the fix is on line 11: `let mut s`, so `add` can borrow it mutably."
        concepts: [method.auto-ref, method.self, err.E0596]

      - type: mcq
        id: mcq-ref-receiver
        prompt: "`view` is a `&Rect` and `area` takes `&self`. What happens in `view.area()`?"
        options:
          - { id: a, text: "`view` is passed as `self` as it is, since it's already a `&Rect`" }
          - { id: b, text: "It fails: you must write `(*view).area()`", why: "Rust handles references when you call a method, so you don't need to write `*`." }
          - { id: c, text: "It moves the `Rect` out of `view`", why: "`area` only needs a shared borrow, so nothing is moved." }
        answer: a
        explanation: "Method calls work on values and references alike: Rust adds or removes `&` and `*` to match `self`."
        concepts: [method.auto-ref]

      - type: compiles
        id: compiles-chain-consume
        code:
          rust: |
            struct Ticket { owner: String }
            impl Ticket {
                fn new(owner: String) -> Self {
                    Self { owner }
                }
                fn into_owner(self) -> String {
                    self.owner
                }
            }

            fn main() {
                let s = String::from("Li");
                let n = Ticket::new(s).into_owner();
                println!("{n}");
            }
          verify: run
          expectStdout: "Li\n"
        answer: true
        explanation: "`Ticket::new` returns a new `Ticket`, and `into_owner` takes ownership of it. Nothing else uses that ticket, so it prints `Li`."
        concepts: [method.auto-ref, style.new]

      - type: predict-output
        id: predict-review-new
        code:
          rust: |
            struct Light { pct: u32 }

            impl Light {
                fn new() -> Self { Self { pct: 0 } }
                fn up(&mut self) -> &mut Self {
                    self.pct += 25;
                    self
                }
            }

            fn main() {
                let mut lamp = Light::new();
                lamp.up().up();
                println!("{}%", lamp.pct);
            }
          verify: run
        options:
          - { id: a, text: "50%" }
          - { id: b, text: "25%", why: "`up` returns `&mut Self`, so the second `up` changes `lamp` again." }
          - { id: c, text: "0%", why: "`up` borrows `lamp` mutably, so its changes stick." }
        answer: a
        explanation: "`Light::new()` starts at 0, and each `up` adds 25 to the same light."
        concepts: [method.auto-ref, style.new]

  - id: l3
    exercises:
      - type: parsons
        id: parsons-chain
        prompt: Arrange the lines so `add` can be chained
        lines:
          - { id: l1, text: "impl Order {" }
          - { id: l2, text: "    fn add(&mut self) -> &mut Self {" }
          - { id: l3, text: "        self.items += 1;" }
          - { id: l4, text: "        self" }
          - { id: l5, text: "    }" }
          - { id: l6, text: "}" }
        distractors:
          - { id: d1, text: "    fn add(&mut self) -> Self {" }
          - { id: d2, text: "        &self" }
        answer: [l1, l2, l3, l4, l5, l6]
        verify:
          harness: |
            struct Order { items: u32 }
            {{solution}}
            fn main() {
                let mut o = Order { items: 0 };
                o.add().add();
                println!("{}", o.items);
            }
          mode: run
          expectStdout: "2\n"
        explanation: "To chain, `add` returns `&mut Self` and ends with `self`, the mutable borrow it was given."
        concepts: [method.auto-ref]

      - type: fill-tokens
        id: fill-chain-return
        prompt: Fill the blanks so the calls can be chained and the program prints `1000`
        code:
          rust: |
            struct Steps { count: u32 }

            impl Steps {
                fn walk(&mut self) -> ___1___ {
                    self.count += 500;
                    ___2___
                }
            }

            fn main() {
                let mut day = Steps { count: 0 };
                day.walk().walk();
                println!("{}", day.count);
            }
          verify: run
          expectStdout: "1000\n"
        blanks:
          "1": { answer: ["&mut Self"] }
          "2": { answer: ["self"] }
        bank: ["&mut Self", "Self", "self", "&self", "u32"]
        explanation: "`self` here is already a `&mut Steps`, so returning it as `&mut Self` lets the next `walk` change the same value."
        concepts: [method.auto-ref]

      - type: compiles
        id: compiles-two-chain-borrows
        code:
          rust: |
            struct Score { total: u32 }

            impl Score {
                fn add(&mut self) -> &mut Self {
                    self.total += 1;
                    self
                }
            }

            fn main() {
                let mut s = Score { total: 0 };
                let first = s.add();
                let second = s.add();
                println!("{}", first.total);
            }
          verify: compile-fail
          expectErrors: [E0499]
        answer: false
        followUp:
          prompt: Which error?
          options:
            - { id: a, text: "cannot borrow `s` as mutable more than once at a time" }
            - { id: b, text: "cannot borrow `s` as mutable", why: "`s` is declared `let mut`, so one mutable borrow is fine." }
            - { id: c, text: "use of moved value: `s`", why: "`add` takes `&mut self`, so `s` is borrowed, not moved." }
          answer: a
        explanation: "`first` keeps a mutable borrow of `s` alive until the `println!`, so the second `s.add()` can't borrow it again."
        concepts: [method.auto-ref, err.E0499]

      - type: predict-output
        id: predict-three-forms
        code:
          rust: |
            struct Rect { w: u32, h: u32 }

            impl Rect {
                fn area(&self) -> u32 {
                    self.w * self.h
                }
            }

            fn main() {
                let r = Rect { w: 2, h: 3 };
                let a = r.area();
                let b = Rect::area(&r);
                println!("{}", a + b);
            }
          verify: run
        options:
          - { id: a, text: "12" }
          - { id: b, text: "6", why: "Both lines compute the area, and the program prints their sum." }
          - { id: c, text: "10", why: "`area` multiplies 2 by 3, giving 6 each time." }
        answer: a
        explanation: "`r.area()` and `Rect::area(&r)` are the same call, each giving 6, so the sum is 12."
        concepts: [method.auto-ref]

      - type: decode-error
        id: decode-consume-twice
        prompt: What is the compiler telling you?
        code:
          rust: |
            struct Ticket { owner: String }

            impl Ticket {
                fn into_owner(self) -> String {
                    self.owner
                }
            }

            fn main() {
                let owner = String::from("Jo");
                let t = Ticket { owner };
                let a = t.into_owner();
                let b = t.into_owner();
            }
          verify: compile-fail
          expectErrors: [E0382]
        options:
          - { id: a, text: "The first call moved `t` into `into_owner`, so `t` can't be used again" }
          - { id: b, text: "Rust should have borrowed `t` for each call", why: "Rust only borrows for you when the method takes `&self` or `&mut self`. This one takes `self`." }
          - { id: c, text: "`t` needs to be `let mut`", why: "`mut` lets a value change, but it can't bring back a value that has moved." }
        answer: a
        explanation: "`into_owner` takes `self`, so the call moves `t` (the second call fails with *use of moved value*). Rust adds `&` only when the method asks for a borrow."
        concepts: [method.auto-ref, method.self, err.E0382]

      - type: true-false
        id: tf-self-no-borrow
        prompt: "If a method takes plain `self`, then `t.into_owner()` borrows `t` for you."
        answer: false
        explanation: "Rust matches the `self` parameter. For plain `self`, the call moves `t` into the method."
        concepts: [method.auto-ref, method.self]

      - type: predict-output
        id: predict-tiles-chain
        prompt: Build the output
        code:
          rust: |
            struct Cart { items: u32 }

            impl Cart {
                fn add(&mut self) -> &mut Self {
                    self.items += 1;
                    self
                }
            }

            fn main() {
                let mut cart = Cart { items: 0 };
                cart.add().add().add();
                println!("{} items", cart.items);
            }
          verify: run
        tiles: ["3", "1", "items", "add", "0"]
        answer: "3 items"
        explanation: "Each `add` in the chain works on `cart` itself, so it ends with 3 items."
        concepts: [method.auto-ref]

      - type: mcq
        id: mcq-not-same
        prompt: "`area` takes `&self`. Which of these does NOT compile?"
        options:
          - { id: a, code: "Rect::area(rect)" }
          - { id: b, code: "rect.area()", why: "This is the usual form; Rust borrows `rect` for you." }
          - { id: c, code: "(&rect).area()", why: "You wrote the borrow yourself, which is what `&self` needs." }
          - { id: d, code: "Rect::area(&rect)", why: "This passes `&rect` for `&self`, which matches." }
        answer: a
        explanation: "Rust only borrows automatically with the `.` method form. `Rect::area` expects a `&Rect`, so passing `rect` itself is a *mismatched types* error."
        concepts: [method.auto-ref]

      - type: spot-bug
        id: spot-wrong-impl-call
        prompt: Tap the line with the mistake
        code:
          rust: |
            struct Fan { rpm: u32 }

            impl Fan {
                fn new() -> Self { Self { rpm: 1 } }
            }

            impl Fan {
                fn up(&mut self) { self.rpm += 1; }
            }

            fn main() {
                let mut fan = Fan::new();
                fan.up();
                Fan::up(fan);
            }
          verify: compile-fail
          expectErrors: [E0308]
        answer: 14
        explanation: "Line 13 is fine. On line 14 Rust doesn't borrow for you, so it must be `Fan::up(&mut fan)`. Splitting the `impl` in two isn't a problem."
        concepts: [method.auto-ref, err.E0308]

      - type: compiles
        id: compiles-associated-dot-review
        code:
          rust: |
            struct Fan { rpm: u32 }

            impl Fan {
                fn new() -> Self { Self { rpm: 1 } }
            }

            fn main() {
                let fan = Fan::new();
                let other = (&fan).new();
            }
          verify: compile-fail
          expectErrors: [E0599]
        answer: false
        followUp:
          prompt: Why not?
          options:
            - { id: a, text: "`new` has no `self`, so it can't be called on a value, borrowed or not" }
            - { id: b, text: "It should be `(&mut fan).new()`", why: "The kind of borrow doesn't matter: `new` isn't a method at all." }
            - { id: c, text: "`fan` must be `let mut`", why: "Nothing changes `fan`. `new` must be called as `Fan::new()`." }
          answer: a
        explanation: "Automatic referencing only applies to methods. An associated function is always called on the type: `Fan::new()`; with a dot the compiler says *no method named `new` found*."
        concepts: [method.auto-ref, method.associated, err.E0599]
