id: structs-enums.methods.code-read-rectangle
title: Rectangle
icon: ruler
concepts: []
reviewConcepts: [method.self, method.associated, style.new, method.auto-ref, derive.debug, struct.define]
program:
  rust: |
    #[derive(Debug)]
    struct Rect {
        width: u32,
        height: u32,
    }
    impl Rect {
        fn area(&self) -> u32 {
            self.width * self.height
        }
        fn holds(&self, o: &Rect) -> bool {
            self.width > o.width
                && self.height > o.height
        }
        fn square(s: u32) -> Self {
            Self { width: s, height: s }
        }
    }
    fn main() {
        let r =
            Rect { width: 3, height: 5 };
        let sq = Rect::square(2);
        println!("{sq:?}");
        println!("{}", r.area());
        println!("{}", r.holds(&sq));
    }
  verify: run
  expectStdout: |
    Rect { width: 2, height: 2 }
    15
    true
chunks:
  - lines: 5
    exercises:
      - type: mcq
        id: derive-debug
        prompt: "What does `#[derive(Debug)]` on line 1 let you do with a `Rect`?"
        options:
          - { id: a, text: "Print it with `{:?}`" }
          - { id: b, text: "Print it with `{}`", why: "A struct can't be printed with `{}` unless you write that formatting yourself. `derive(Debug)` gives you `{:?}`." }
          - { id: c, text: "Call methods on it", why: "Methods come from `impl` blocks. `derive(Debug)` only adds Debug printing." }
        answer: a
        explanation: "Deriving `Debug` lets you print the struct and its fields with `{:?}` or `{:#?}`."
        concepts: [derive.debug]
  - lines: 4
    exercises:
      - type: mcq
        id: area-receiver
        prompt: "Why does `area` take `&self` rather than `self`?"
        options:
          - { id: a, text: "It only reads the fields, so the caller can keep using the rectangle afterwards" }
          - { id: b, text: "`self` would let it change `width`", why: "Plain `self` takes ownership. It's about who owns the value, and `area` doesn't need to own it." }
          - { id: c, text: "Methods with `self` can't return a value", why: "They can return anything. But `self` would move the rectangle into `area`." }
        answer: a
        explanation: "`&self` borrows the rectangle read-only. With plain `self`, calling `r.area()` would move `r` and it couldn't be used on line 24."
        concepts: [method.self]
      - type: true-false
        id: area-full-form
        prompt: "`r.area()` could also be written `Rect::area(&r)`."
        answer: true
        explanation: "The method call borrows `r` for you. Written in full, you pass `&r` yourself."
        concepts: [method.auto-ref]
  - lines: 4
    exercises:
      - type: mcq
        id: can-hold-other
        prompt: "In `holds`, what is `o`?"
        options:
          - { id: a, text: "A borrowed second rectangle, passed in the brackets" }
          - { id: b, text: "The rectangle the method was called on", why: "That's `self`. `o` is the extra parameter after it." }
          - { id: c, text: "An owned rectangle that `holds` moves", why: "Its type is `&Rect`, so it's only borrowed." }
        answer: a
        explanation: "Methods can take more parameters after `self`. `o: &Rect` borrows a second rectangle to compare with."
        concepts: [method.self]
      - type: true-false
        id: can-hold-strict
        prompt: "`holds` returns `true` for two rectangles of exactly the same size."
        answer: false
        explanation: "It uses `>`, so each side of `self` must be strictly bigger than the matching side of `o`."
        concepts: [method.self, types.bool]
  - lines: 4
    exercises:
      - type: mcq
        id: square-kind
        prompt: "`square` has no `self` parameter. How is it called?"
        options:
          - { id: a, code: "Rect::square(2)" }
          - { id: b, code: "r.square(2)", why: "Without `self` it's an associated function, not a method, so a dot call is E0599." }
          - { id: c, code: "square(2)", why: "`square` belongs to `Rect`, so it needs the type name in front." }
        answer: a
        explanation: "Associated functions are called on the type with `::`."
        concepts: [method.associated]
      - type: mcq
        id: square-self
        prompt: "What does `Self` mean on lines 14 and 15?"
        options:
          - { id: a, text: "`Rect`, the type of the `impl` block" }
          - { id: b, text: "The rectangle `square` was called on", why: "`square` isn't called on a rectangle. Capital `Self` is a type." }
          - { id: c, text: "A square, a different type from `Rect`", why: "There's no separate square type. `square` builds a `Rect` with equal sides." }
        answer: a
        explanation: "`Self` is short for the `impl` block's type, so `square` returns a `Rect`."
        concepts: [method.associated, style.new]
  - lines: 4
    exercises:
      - type: mcq
        id: sq-fields
        prompt: "After line 21, what does `sq` hold?"
        options:
          - { id: a, text: "A `Rect` with width 2 and height 2" }
          - { id: b, text: "The number 4", why: "`square` returns a `Rect`, not its area." }
          - { id: c, text: "A `Rect` with width 2 and height 0", why: "`square` uses `s` for both fields." }
        answer: a
        explanation: "`Rect::square(2)` builds `Self { width: 2, height: 2 }`."
        concepts: [method.associated]
  - lines: 4
    exercises:
      - type: mcq
        id: debug-line
        prompt: "What does line 22 print?"
        options:
          - { id: a, text: "`Rect { width: 2, height: 2 }`" }
          - { id: b, text: "`4`", why: "`{sq:?}` prints the struct itself, not its area." }
          - { id: c, text: "`sq`", why: "The braces print the value of `sq`, in Debug format." }
        answer: a
        explanation: "Debug format prints the struct's name followed by each field and its value."
        concepts: [derive.debug]
      - type: mcq
        id: last-lines
        prompt: "What do lines 23 and 24 print?"
        options:
          - { id: a, text: "`15` then `true`" }
          - { id: b, text: "`8` then `true`", why: "`area` multiplies the sides; 3 + 5 would be 8." }
          - { id: c, text: "`15` then `false`", why: "3 > 2 and 5 > 2, so `r` can hold `sq`." }
        answer: a
        explanation: "`r.area()` is 3 times 5. Both sides of `r` are bigger than 2, so `holds` returns `true`."
        concepts: [method.self, method.auto-ref]
      - type: true-false
        id: swap-can-hold
        prompt: "`sq.holds(&r)` would also be `true`."
        answer: false
        explanation: "Now `self` is `sq`, and 2 isn't bigger than 3, so it returns `false`. The order of the two rectangles matters."
        concepts: [method.self]
