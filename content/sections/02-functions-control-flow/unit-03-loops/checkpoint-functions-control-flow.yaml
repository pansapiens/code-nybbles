id: functions-control-flow.loops.checkpoint
title: "Checkpoint: Functions & Control Flow"
icon: flag
concepts: []
reviewConcepts:
  - ctrl.loop
  - ctrl.break-value
  - ctrl.while
  - ctrl.for
  - range.basics
  - ctrl.continue
  - ctrl.labels
  - practice.fizzbuzz
  - fn.define
  - fn.params
  - fn.return
  - fn.early-return
  - expr.vs-stmt
  - expr.block
  - err.E0308
  - ctrl.if
  - ctrl.if-expr
  - match.intro
  - var.shadowing
  - fmt.width-precision
  - panic.index
lessons:
  - id: l1
    exercises:
      - type: predict-output
        id: predict-early-return-loop
        code:
          rust: |
            fn root_above(limit: i32) -> i32 {
                let mut n = 1;
                loop {
                    if n * n > limit {
                        return n;
                    }
                    n += 1;
                }
            }

            fn main() {
                println!("{}", root_above(30));
            }
          verify: run
        options:
          - { id: a, text: "6" }
          - { id: b, text: "36", why: "The function returns `n`, not `n * n`." }
          - { id: c, text: "5", why: "5 x 5 is 25, which isn't over 30, so the loop goes on to 6." }
        answer: a
        explanation: "`return` leaves the loop and the function at once. 6 is the first `n` whose square, 36, is over 30."
        concepts: [fn.early-return, ctrl.loop]

      - type: compiles
        id: compiles-trailing-semicolon
        code:
          rust: |
            fn sum_to(n: u32) -> u32 {
                let mut total = 0;
                for i in 1..=n {
                    total += i;
                }
                total;
            }

            fn main() {
                println!("{}", sum_to(4));
            }
          verify: compile-fail
          expectErrors: [E0308]
        answer: false
        followUp:
          prompt: Which error?
          options:
            - { id: a, text: "E0308: mismatched types" }
            - { id: b, text: "E0384: cannot assign twice to immutable variable", why: "`total` is `mut`, so `+=` is fine." }
            - { id: c, text: "E0425: cannot find value in this scope", why: "`total` is in scope on line 6. It's the `;` that causes the problem." }
          answer: a
        explanation: "`total;` is a statement, so the body ends without a value and gives `()`. Remove the `;` to return `total`."
        concepts: [fn.return, expr.vs-stmt, err.E0308]

      - type: decode-error
        id: decode-if-no-else
        prompt: What is the compiler telling you?
        code:
          rust: |
            fn main() {
                for n in 0..3 {
                    let kind = if n > 1 { "big" };
                    println!("{kind}");
                }
            }
          verify: compile-fail
          expectErrors: [E0317]
        options:
          - { id: a, text: "When `n` isn't above 1 the `if` has no value, so it needs an `else` arm" }
          - { id: b, text: "`let` can't be used inside a `for` loop", why: "It can. Each pass creates a fresh `kind`." }
          - { id: c, text: "`n > 1` isn't a valid condition", why: "`n > 1` is a `bool`, which is fine. The missing `else` is the problem." }
        answer: a
        explanation: "An `if` used as a value must give a value either way. Add `else { \"small\" }`."
        concepts: [ctrl.if-expr, ctrl.for]

      - type: fill-tokens
        id: fill-block-loop
        prompt: "Fill the blanks so the program prints `10`"
        code:
          rust: |
            fn main() {
                let total = {
                    let mut sum = 0;
                    for n in 1___1___4 {
                        sum += n;
                    }
                    ___2___
                };
                println!("{total}");
            }
          verify: run
          expectStdout: "10\n"
        blanks:
          "1": { answer: ["..="] }
          "2": { answer: ["sum"] }
        bank: ["..=", "..", "sum", "sum;", "break sum;"]
        explanation: "`1..=4` adds 1 + 2 + 3 + 4. A block's value is its last expression, with no `;`. `break` only works inside a loop."
        concepts: [expr.block, range.basics]

      - type: spot-bug
        id: spot-index-panic
        prompt: "This prints three scores, then panics. Tap the line with the mistake."
        code:
          rust: |
            fn main() {
                let scores = [70, 85, 90];
                for i in 0..=scores.len() {
                    println!("{}", scores[i]);
                }
            }
          verify: run
          expectPanic: "index out of bounds"
        answer: 3
        explanation: "`0..=scores.len()` includes 3, but the last index is 2. The fix is `0..scores.len()` on line 3."
        concepts: [range.basics, panic.index]

      - type: predict-output
        id: predict-match-temps
        code:
          rust: |
            for t in [5, 18, 30] {
                let feel = match t {
                    0..=10 => "cold",
                    11..=25 => "mild",
                    _ => "hot",
                };
                println!("{feel}");
            }
          verify: run
        options:
          - { id: a, text: "cold\nmild\nhot" }
          - { id: b, text: "cold\ncold\ncold", why: "`match` runs on every pass, with each temperature in turn." }
          - { id: c, text: "hot", why: "The `println!` is inside the loop, so it runs three times." }
        answer: a
        explanation: "The loop gives `t` each element, and `match` picks the first range that contains it."
        concepts: [match.intro, ctrl.for]

      - type: predict-output
        id: predict-shadow-in-loop
        code:
          rust: |
            let mut total = 0;
            for n in 1..=3 {
                let n = n * 10;
                total += n;
            }
            println!("{total}");
          verify: run
        options:
          - { id: a, text: "60" }
          - { id: b, text: "6", why: "The shadowing `n` is 10 times the loop's `n`, and that's what gets added." }
          - { id: c, text: "30", why: "Each pass adds its own `n * 10`: 10, 20 and 30." }
        answer: a
        explanation: "Each pass shadows `n` with `n * 10`, so the loop adds 10 + 20 + 30."
        concepts: [var.shadowing, ctrl.for]

      - type: parsons
        id: parsons-sum-to
        prompt: "Arrange the lines so `sum_to(4)` returns `10`"
        lines:
          - { id: l1, text: "fn sum_to(n: u32) -> u32 {" }
          - { id: l2, text: "    let mut total = 0;" }
          - { id: l3, text: "    for i in 1..=n {" }
          - { id: l4, text: "        total += i;" }
          - { id: l5, text: "    }" }
          - { id: l6, text: "    total" }
          - { id: l7, text: "}" }
        distractors:
          - { id: d1, text: "    total;" }
          - { id: d2, text: "    for i in 1..n {" }
        answer: [l1, l2, l3, l4, l5, l6, l7]
        verify:
          harness: |
            {{solution}}
            fn main() {
                println!("{}", sum_to(4));
            }
          mode: run
          expectStdout: "10\n"
        explanation: "The range must include `n`, and the last line `total` (no `;`) is the return value."
        concepts: [fn.return, ctrl.for, range.basics]

      - type: true-false
        id: tf-return-from-for
        prompt: "`has_seven([1, 7, 3, 7])` stops checking after the first 7."
        code:
          rust: |
            fn has_seven(nums: [i32; 4]) -> bool {
                for n in nums {
                    if n == 7 {
                        return true;
                    }
                }
                false
            }

            fn main() {
                let found = has_seven([1, 7, 3, 7]);
                println!("{found}");
            }
          verify: run
          expectStdout: "true\n"
        answer: true
        explanation: "`return true` leaves the function from inside the loop. `false` is only reached if no element is 7."
        concepts: [fn.early-return, ctrl.for]

      - type: mcq
        id: mcq-unit-value
        prompt: "Which line gives `result` the unit value `()`?"
        options:
          - { id: a, code: "let result = while false {};" }
          - { id: b, code: "let result = loop { break 5; };", why: "`break 5` gives the loop the value 5." }
          - { id: c, code: "let result = { 5 };", why: "The block ends with `5` and no `;`, so its value is 5." }
          - { id: d, code: "let result = if true { 1 } else { 2 };", why: "This `if` has a value in both arms, so `result` is 1." }
        answer: a
        explanation: "A `while` loop always has the value `()`. `loop`, blocks and `if` can all give other values."
        concepts: [ctrl.while, expr.block, ctrl.if-expr]

      - type: predict-output
        id: predict-width-rev
        code:
          rust: |
            for n in (8..=10).rev() {
                println!("[{n:>3}]");
            }
          verify: run
        options:
          - { id: a, text: "[ 10]\n[  9]\n[  8]" }
          - { id: b, text: "[10 ]\n[9  ]\n[8  ]", why: "`>` aligns to the right, so the spaces go before the number." }
          - { id: c, text: "[  8]\n[  9]\n[ 10]", why: "`.rev()` counts down from 10." }
        answer: a
        explanation: "`{n:>3}` pads each number to 3 characters, right-aligned, and `.rev()` gives 10, 9, 8."
        concepts: [fmt.width-precision, range.basics]

      - type: compiles
        id: compiles-param-immutable
        code:
          rust: |
            fn countdown(n: u32) {
                while n > 0 {
                    println!("{n}");
                    n -= 1;
                }
            }

            fn main() {
                countdown(3);
            }
          verify: compile-fail
          expectErrors: [E0384]
        answer: false
        followUp:
          prompt: Which error?
          options:
            - { id: a, text: "E0384: cannot assign to immutable argument" }
            - { id: b, text: "E0308: mismatched types", why: "`n` is a `u32` and `n > 0` is a `bool`, so the types are fine." }
            - { id: c, text: "E0425: cannot find value in this scope", why: "`n` is the parameter, so it's in scope inside the function." }
          answer: a
        explanation: "Parameters are immutable, like `let` variables. Copy it first with `let mut left = n;`, or write the parameter as `mut n: u32`."
        concepts: [fn.params, ctrl.while]

      - type: decode-error
        id: decode-missing-return-type
        prompt: Which change fixes the error?
        code:
          rust: |
            fn largest(a: i32, b: i32) {
                if a > b { a } else { b }
            }

            fn main() {
                let big = largest(3, 8);
                println!("{big:?}");
            }
          verify: compile-fail
          expectErrors: [E0308]
        options:
          - { id: a, text: "Change line 1 to `fn largest(a: i32, b: i32) -> i32 {`" }
          - { id: b, text: "Add `;` at the end of line 2", why: "That would compile, but `largest` would give `()` and throw the bigger number away." }
          - { id: c, text: "Change line 2 to `return if a > b { a } else { b }`", why: "Without a return type the function still must give `()`, so returning an `i32` is the same error." }
        answer: a
        explanation: "With no `->`, a function's return type is `()`. The `if` gives an `i32`, so the function needs `-> i32`."
        concepts: [fn.return, ctrl.if-expr, err.E0308]

      - type: predict-output
        id: predict-if-expr-loop
        code:
          rust: |
            for n in 1..=3 {
                let kind = if n % 2 == 0 {
                    "even"
                } else {
                    "odd"
                };
                println!("{n} {kind}");
            }
          verify: run
        options:
          - { id: a, text: "1 odd\n2 even\n3 odd" }
          - { id: b, text: "1 even\n2 odd\n3 even", why: "`n % 2 == 0` is true for even numbers, like 2." }
          - { id: c, text: "1 odd\n2 even", why: "`1..=3` includes 3." }
        answer: a
        explanation: "Each pass, the `if` gives `\"even\"` or `\"odd\"`, which is stored in `kind`."
        concepts: [ctrl.if-expr, range.basics]

      - type: match-pairs
        id: pairs-control-flow
        prompt: Match each keyword to what it does
        pairs:
          - ["loop", "repeats until `break`, which can give a value"]
          - ["while", "checks a condition before each pass"]
          - ["for", "steps through a range or an array"]
          - ["continue", "skips to the next pass"]
          - ["return", "leaves the whole function"]
        concepts: [ctrl.loop, ctrl.while, ctrl.for, ctrl.continue, fn.early-return]
