        explanation: "The `match` gives the number for `Ok`, or skips to the next guess for `Err`. The `;` after `}` ends the `let` statement."
        concepts: [ctrl.loop-input]

      - type: spot-bug
        id: spot-err-break
        prompt: "You type `50`, `abc`, then `42`. The game should skip `abc` and keep asking, but it stops after `50`. Tap the line with the mistake."
