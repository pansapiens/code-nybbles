  # ---------------------------------------------------------------- step 5
  - id: use-rand
    title: A random secret
    goal: |
      **A fixed secret makes a dull game.** The Book picks a random number with `rand`, a **crate**: a package of Rust code that someone published on crates.io. Cargo downloads and builds crates for you.

      This app can't run crates, so your program keeps `42` and shows the `rand` lines as comments.
    file:
      rust: |
        use std::cmp::Ordering;
        use std::io;
        // use rand::prelude::*;

        fn main() {
            println!("Guess the number!");
            // let secret = rand::rng()
            //     .random_range(1..=100);
            let secret = 42;

            loop {
                println!("Input your guess.");

                let mut guess = String::new();
                io::stdin()
                    .read_line(&mut guess)
                    .expect("Failed to read");

                let guess: u32 =
                    match guess.trim().parse() {
                        Ok(num) => num,
                        Err(_) => continue,
                    };

                println!("You guessed {guess}");

                match guess.cmp(&secret) {
                    Ordering::Less => {
                        println!("Too small!");
                    }
                    Ordering::Greater => {
                        println!("Too big!");
                    }
                    Ordering::Equal => {
                        println!("You win!");
                        break;
                    }
                }
            }
        }
      verify: run
      stdin: "50\nabc\n25\n42\n"
      expectStdout: "Guess the number!\nInput your guess.\nYou guessed 50\nToo big!\nInput your guess.\nInput your guess.\nYou guessed 25\nToo small!\nInput your guess.\nYou guessed 42\nYou win!\n"
    exercises:
      - type: concept
        id: concept-add-crate
        title: Adding a crate
        markdown: |
          **List the crate under `[dependencies]` in `Cargo.toml`.** The next `cargo run` downloads and compiles it.

          ```toml
          [dependencies]
          rand = "0.10.1"
          ```

          Then `use rand::prelude::*;` at the top of `main.rs` brings in what `random_range` needs. `rand::rng()` gives a generator seeded by the operating system:

          ```rust
          let secret = rand::rng()
              .random_range(1..=100);
          ```
        concepts: [cargo.dependency-intro]

      - type: mcq
        id: mcq-cargo-toml
        prompt: "What is `Cargo.toml` for?"
        options:
          - { id: a, text: "It describes your package and lists the crates it depends on" }
          - { id: b, text: "It holds your program's Rust code", why: "Your code goes in `src/main.rs`. `Cargo.toml` is settings for Cargo." }
          - { id: c, text: "It's the compiled program that you run", why: "Cargo puts the compiled program in `target/`. `Cargo.toml` is a text file you edit." }
        answer: a
        explanation: "`Cargo.toml` names your package and lists its dependencies. Cargo reads it to know which crates to download and build."
        concepts: [cargo.dependency-intro]

      - type: fill-tokens
        id: fill-dependencies
        prompt: "Fill the blank so Cargo adds the `rand` crate"
        code:
          rust: |
            [___1___]
            rand = "0.10.1"
          verify: none
          verifyReason: "`Cargo.toml` text, not Rust; the verifier has no crates"
        blanks:
          "1": { answer: ["dependencies"] }
        bank: ["dependencies", "package", "crates", "use"]
        explanation: "Crates your program uses go under `[dependencies]`. `[package]` holds your own package's name and version."
        concepts: [cargo.dependency-intro]

      - type: mcq
        id: mcq-range-values
        prompt: "Which numbers can `random_range(1..=100)` give?"
        options:
          - { id: a, text: "Any whole number from 1 to 100, including 100" }
          - { id: b, text: "1 to 99", why: "That would be `1..100`. The `=` in `..=` includes the end." }
          - { id: c, text: "0 to 100", why: "The range starts at `1`, so `0` is never picked." }
        answer: a
        explanation: "`1..=100` is an inclusive range, as in `for` loops from Unit 2.3: both `1` and `100` are included."
        concepts: [cargo.dependency-intro, range.basics]

      - type: true-false
        id: tf-fixed-testing
        prompt: "With `let secret = 42;`, typing `50`, then `25`, then `42` prints the same output on every run."
        answer: true
        explanation: "A fixed secret makes the program predictable, so its output can be checked against known input. With `rand`, the hints would change from run to run."
        concepts: [cargo.dependency-intro]

      - type: mcq
        id: mcq-cargo-output
        prompt: "After adding `rand`, `cargo run` prints `Downloaded rand v0.10.1` and `Compiling rand v0.10.1` before `Guess the number!`. What do these lines mean?"
        options:
          - { id: a, text: "Cargo fetched the `rand` crate and compiled it along with your program" }
          - { id: b, text: "Your program printed them", why: "Your program's first line is `Guess the number!`. The lines before it come from Cargo." }
          - { id: c, text: "Something went wrong while building", why: "These are progress messages. Problems are marked with `error` or `warning`." }
        answer: a
        explanation: "Cargo downloads each new dependency once, compiles it, then compiles and runs your program. The next `cargo run` reuses the compiled crate."
        concepts: [cargo.dependency-intro]

      - type: match-pairs
        id: pairs-crate-pieces
        prompt: Match each piece to where it belongs
        pairs:
          - ['rand = "0.10.1"', "Cargo.toml"]
          - ["use rand::prelude::*;", "top of main.rs"]
          - ["random_range(1..=100)", "inside main"]
          - ["the rand crate", "crates.io"]
        concepts: [cargo.dependency-intro]
