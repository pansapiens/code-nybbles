              }
          expectStdout: "Part: 50\nTool: 3\n"
        blanks:
          "1": { answer: ["BTreeMap"] }
          "2": { answer: ["entry"] }
          "3": { answer: ["or_insert"] }
        bank: ["BTreeMap", "entry", "or_insert", "HashMap", "get", "insert"]
        explanation: "`entry(key).or_insert(0)` starts a category at 0 the first time it's seen and returns a `&mut` to its total, which `+=` then increases. The `BTreeMap` prints the categories in sorted order."
        concepts: [practice.inventory, map.entry]

      - type: predict-output
        id: predict-sorted-totals
        code:
          rust: |
            use std::collections::BTreeMap;
            fn main() {
                let mut sums = BTreeMap::new();
                for (cat, qty) in [
                    ("Tool", 3), ("Part", 40),
                    ("Part", 10),
                ] {
                    let total = sums.entry(cat)
                        .or_insert(0);
                    *total += qty;
                }
                for (cat, total) in &sums {
                    println!("{cat}: {total}");
                }
            }
          verify: run
        options:
          - id: a
            text: "Part: 50\nTool: 3"
          - id: b
            text: "Tool: 3\nPart: 50"
            why: "A `BTreeMap` doesn't remember the order you inserted keys. It visits them sorted, and `Part` comes before `Tool`."
          - id: c
            text: "Tool: 3\nPart: 40\nPart: 10"
            why: "A map has one entry per key. The second `Part` finds the existing entry and adds to it."
        answer: a
        explanation: "`entry` finds `Part` the second time, so its total becomes 50. The loop then visits the keys in sorted order: `Part`, then `Tool`."
        concepts: [map.entry, map.iter]

      - type: mcq
        id: mcq-why-btreemap
        prompt: "Why does `report` use a `BTreeMap` rather than a `HashMap`?"
        options:
          - id: a
            text: "So the categories print in sorted order, the same on every run"
          - id: b
            text: "A `HashMap` has no `entry` method"
            why: "`HashMap` has the same `entry(...).or_insert(...)` API. The difference is the order of its loop."
          - id: c
            text: "A `HashMap` can't use `String` keys"
            why: "`String` keys work in both maps. Word counts in a `HashMap` often use them."
        answer: a
        explanation: "Looping over a `HashMap` gives its keys in an unpredictable order that can change between runs. A `BTreeMap` always gives them sorted, so the report is stable."
        concepts: [collections.choose, map.iter]

      - type: decode-error
        id: decode-enum-key
        prompt: What does this error mean?
        code:
          rust: |
            use std::collections::BTreeMap;

            #[derive(Debug)]
            enum Category { Tool, Food }

            fn main() {
                let mut sums = BTreeMap::new();
                sums.insert(Category::Tool, 3);
                println!("{sums:?}");
            }
          verify: compile-fail
          expectErrors: [E0277]
        options:
          - id: a
            text: "A `BTreeMap` sorts its keys, and `Category` can't be compared, so it can't be a key"
          - id: b
            text: "`Category` needs `#[derive(Debug)]` to go into a map"
            why: "`Category` already derives `Debug`. The error asks for `Ord`, which is about ordering."
          - id: c
            text: "A `BTreeMap` can't hold numbers as values"
            why: "Values can be any type. The complaint is about the key type."
        answer: a
        explanation: "`Ord` is the ability to put values in order. A `BTreeMap` needs it for its keys, which is why `report` uses the category's name, a `String`, as the key."
        concepts: [collections.choose, err.E0277]

      - type: parsons
        id: parsons-count-per-category
        prompt: Arrange the lines to count how many different items each category has
        lines:
          - { id: l1, text: "let mut sums = BTreeMap::new();" }
          - { id: l2, text: "for item in &items {" }
          - { id: l3, text: "    let c = &item.category;" }
          - { id: l4, text: "    let key = format!(\"{c:?}\");" }
          - { id: l5, text: "    *sums.entry(key).or_insert(0) += 1;" }
          - { id: l6, text: "}" }
          - { id: l7, text: "println!(\"{sums:?}\");" }
        distractors:
          - { id: d1, text: "    sums.insert(key, 1);" }
        answer: [l1, l2, l3, l4, l5, l6, l7]
        verify:
          harness: |
            use std::collections::BTreeMap;
            #[derive(Debug)]
            enum Category { Tool, Part }
            struct Item {
                category: Category,
            }
            fn main() {
                let items = vec![
                    Item { category: Category::Part },
                    Item { category: Category::Tool },
                    Item { category: Category::Part },
                ];
            {{solution}}
            }
          mode: run
          expectStdout: "{\"Part\": 2, \"Tool\": 1}\n"
        explanation: "The map is made before the loop. Inside it, each item's category name becomes a key, and `or_insert(0)` then `+= 1` counts it; `insert(key, 1)` would reset the count to 1 each time."
        concepts: [practice.inventory, map.entry]

      - type: true-false
        id: tf-report-borrows
        prompt: "After `inv.report();`, `main` can still use `inv`."
        answer: true
        explanation: "`report` takes `&self`, so it only borrows the inventory while it runs. Ownership stays with `inv` in `main`."
        concepts: [method.self, borrow.shared]
