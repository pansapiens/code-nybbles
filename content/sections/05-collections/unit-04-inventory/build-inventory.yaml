              #[derive(Debug)]
              enum Category { Tool, Part }
              struct Item {
                  qty: u32,
                  category: Category,
              }
              struct Inventory { items: Vec<Item> }
              impl Inventory {
            after: |
              }
              fn main() {
                  let inv = Inventory { items: vec![
                      Item { qty: 3, category: Category::Tool },
                      Item { qty: 40, category: Category::Part },
