  # ---------------------------------------------------------------- step 5
  - id: report
    title: Report totals by category
    goal: |
      **The owner wants a stock summary: how much of each category is on the shelves.** The `report` method adds up quantities per category with the entry API, then prints the totals.

      A `BTreeMap` keeps its keys sorted, so the report comes out in the same order every run.
    file:
      rust: |
        use std::collections::BTreeMap;

        #[derive(Debug)]
        enum Category { Tool, Food, Part }

        #[derive(Debug)]
        struct Item {
            name: String,
            qty: u32,
            category: Category,
        }

        struct Inventory { items: Vec<Item> }

        impl Inventory {
            fn new() -> Self {
                Inventory { items: Vec::new() }
            }

            fn add(&mut self, item: Item) {
                for old in &mut self.items {
                    if old.name == item.name {
                        old.qty += item.qty;
                        return;
                    }
                }
                self.items.push(item);
            }

            fn find(&self, name: &str)
                -> Option<&Item> {
                for item in &self.items {
                    if item.name == name {
                        return Some(item);
                    }
                }
                None
            }

            fn report(&self) {
                let mut sums = BTreeMap::new();
                for item in &self.items {
                    let c = &item.category;
                    let total = sums
                        .entry(format!("{c:?}"))
                        .or_insert(0);
                    *total += item.qty;
                }
                for (c, total) in &sums {
                    println!("{c}: {total}");
                }
            }
        }

        fn main() {
            let mut inv = Inventory::new();
            for (name, qty, category) in [
                ("hammer", 3, Category::Tool),
                ("rice", 5, Category::Food),
                ("bolts", 40, Category::Part),
                ("rice", 10, Category::Food),
            ] {
                inv.add(Item {
                    name: name.to_string(),
                    qty,
                    category,
                });
            }
            let n = inv.items.len();
            println!("{n} items");
            println!("{:?}", inv.find("rice"));
            println!("{:?}", inv.find("glue"));
            inv.report();
        }
      verify: run
      expectStdout: "3 items\nSome(Item { name: \"rice\", qty: 15, category: Food })\nNone\nFood: 15\nPart: 40\nTool: 3\n"
    exercises:
      - type: concept
        id: concept-debug-key
        title: A key that sorts
        markdown: |
          A `BTreeMap` keeps its keys in order, so it needs keys it can compare. `Category` can't be compared yet; that needs extra `derive`s you'll meet later.

          Its Debug name can, though: `format!("{c:?}")` turns `Category::Food` into the `String` `"Food"`, and strings sort alphabetically.
        code:
          rust: |
            #[derive(Debug)]
            enum Category { Tool, Food }

            let c = Category::Food;
            let key = format!("{c:?}");
            println!("{key}");
          verify: run
          expectStdout: "Food\n"
        concepts: [fmt.debug, collections.choose]

      - type: fill-tokens
        id: fill-report
        prompt: Fill the blanks to add up the quantities per category
        code:
