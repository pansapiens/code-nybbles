                    let total = sums
                        .___2___(format!("{c:?}"))
                        .___3___(0);
                    *total += item.qty;
                }
                for (c, total) in &sums {
                    println!("{c}: {total}");
                }
            }
          verify: run
          wrap: none
          hidden:
            before: |
